<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Puttedex</title>
  <meta name="robots" content="noindex">
  <!-- The standalone course map page was merged into tournament.html. This stub only keeps old links working:
       course.html?t=<id>                 -> tournament.html?t=<id>#holes
       course.html?hole=<id>&shot=<n>     -> hole.html?t=<id>&h=<n>   (links from the first version) -->
  <script>
    (function () {
      var p = new URLSearchParams(location.search);
      var e = encodeURIComponent;
      var to = p.has('hole') && !p.has('t')
        ? 'hole.html?t=' + e(p.get('hole')) + '&h=' + e(p.get('shot') || '1')
        : p.has('t') ? 'tournament.html?t=' + e(p.get('t')) + '#holes' : './';
      location.replace(to);
    })();
  </script>
</head>
<body>
  <p><a href="./">Puttedex has moved things around. Continue to the tour schedule.</a></p>
</body>
</html>
